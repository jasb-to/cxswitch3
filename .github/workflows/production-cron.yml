name: Production Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Run CXSwitch V28 cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cxswitch3.vercel.app/api/cron"

      - name: Run independent ETH strategies
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cxswitch3.vercel.app/api/cron/independent"
