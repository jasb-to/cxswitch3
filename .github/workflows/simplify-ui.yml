name: simplify-ui
on:
  push:
    branches: [feat/simplify-ui]
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify symbol cards
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx'); s=p.read_text()
          # Remove verbose 1D and 4H 5/13 diagnostic cards from the symbol-card render.
          s=re.sub(r'\n\s*\{dailyDiag&&<div.*?(?=\n\s*\{diag&&<div)', '', s, count=1, flags=re.S)
          s=re.sub(r'\n\s*\{diag&&<div.*?(?=\n\s*<div className="mt-3 rounded-xl border p-3)', '', s, count=1, flags=re.S)
          # State of Play should be a concise stage headline, not another explanation of every indicator.
          s=s.replace('<div className="mt-1 text-[9px] text-white/45">{play.detail}</div>','')
          s=s.replace('<div className="mt-1 text-[9px] text-white/35">{play.waiting}</div>','')
          # Remove unused diagnostic variables after the cards are gone.
          s=s.replace(',ema=emaRead(m),diag=ema513Read(m),dailyDiag=daily513Read(m),dirTone=directionTone(m)', ',ema=emaRead(m),dirTone=directionTone(m)')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Simplify symbol cards to actionable information"
          git push
          rm -f .github/workflows/simplify-ui.yml
          git add -A
          git commit -m "Remove temporary UI workflow" || true
          git push
