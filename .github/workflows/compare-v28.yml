name: Historical V28 vs Current Strategy Comparison

on:
  push:
    branches:
      - research/v28-vs-current-backtest
    paths:
      - scripts/compare-v28.js
      - .github/workflows/compare-v28.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript transpiler
        run: npm install --no-save --ignore-scripts typescript@5.7.3
      - name: Run historical comparison
        run: node scripts/compare-v28.js
      - name: Upload trade ledger and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v28-vs-current-backtest
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
