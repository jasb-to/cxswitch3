name: One-time CXSwitch strength fix

on:
  push:
    paths:
      - '.github/workflows/one-time-strength-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical strength classification fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/strategy.ts')
          s = p.read_text()
          old = '''function strength(c:Candle[],d:"LONG"|"SHORT"){const h=c.slice(-20).map(x=>x.high),l=c.slice(-20).map(x=>x.low);return d==="LONG"&&h.at(-1)!>Math.max(...h.slice(0,-1))||d==="SHORT"&&l.at(-1)!<Math.min(...l.slice(0,-1))?"STRONG":"MEDIUM";}'''
          new = '''function strength(c:Candle[],d:"LONG"|"SHORT"){const h=c.slice(-20).map(x=>x.high),l=c.slice(-20).map(x=>x.low),closes=c.map(x=>x.close),f=ema(closes,DAILY_FAST),s=ema(closes,DAILY_SLOW),e5=f.at(-1)!,e5p=f.at(-2)!,spread=e5-s.at(-1)!,prevSpread=e5p-s.at(-2)!,weakening=d==="LONG"&&e5<e5p&&Math.abs(spread)<Math.abs(prevSpread)||d==="SHORT"&&e5>e5p&&Math.abs(spread)<Math.abs(prevSpread);if(weakening)return"LOW";return d==="LONG"&&h.at(-1)!>Math.max(...h.slice(0,-1))||d==="SHORT"&&l.at(-1)!<Math.min(...l.slice(0,-1))?"STRONG":"MEDIUM";}'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one strength function match, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit surgical fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/strategy.ts
          git rm .github/workflows/one-time-strength-fix.yml
          git commit -m "Fix weakening 1D trend strength label"
          git push
