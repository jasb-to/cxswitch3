name: Horizontal structure family research
on:
  push:
    branches: [main]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run horizontal structure family research
        run: node scripts/research-horizontal-structure-family.mjs
