name: Kimi final BTC SOL HYPE research
on:
  push:
    branches: [research/kimi-btc-sol-hype-final-20260915]
  pull_request:
    branches: [main]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run research
        run: |
          python - <<'PY'
          p='scripts/research-kimi-btc-sol-hype.mjs'
          s=open(p).read()
          s=s.replace("Math.abs(x.l-q.c))});", "Math.abs(x.l-q.c))}));")
          open(p,'w').write(s)
          PY
          node scripts/research-kimi-btc-sol-hype.mjs > research/kimi-final-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-final-results
          path: research/kimi-final-results.json
