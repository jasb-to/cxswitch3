name: Kimi final BTC SOL HYPE research
on:
  push:
    branches: [research/kimi-btc-sol-hype-final-20260915]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/research-kimi-btc-sol-hype.mjs > research/kimi-final-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-final-results
          path: research/kimi-final-results.json
