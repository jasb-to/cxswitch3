name: TL family walk-forward
on:
  push:
    branches: [main]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TL family research
        run: node scripts/research-tl-family-walkforward.mjs