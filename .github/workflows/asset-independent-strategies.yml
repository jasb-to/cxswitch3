name: Asset independent strategy research
on:
  push:
    branches: [research/asset-independent-strategies-2026-09-14]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/research-asset-independent-strategies-v2.mjs > research/asset-v2-results.json
      - run: node scripts/research-eth-strategy.mjs > research/eth-results.json
      - name: Persist research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/asset-v2-results.json research/eth-results.json
          git diff --cached --quiet || git commit -m "Research: persist independent strategy results [skip ci]"
          git push
