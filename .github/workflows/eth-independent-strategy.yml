name: ETH independent strategy research
on:
  push:
    branches: [research/asset-independent-strategies-2026-09-14]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/research-eth-strategy.mjs
