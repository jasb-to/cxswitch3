name: Alpha ranking live research
on:
  push:
    branches: [research/quant-alpha-lab]
  workflow_dispatch:
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ranking experiment
        run: |
          node <<'NODE'
          const P={BTC:'PF_XBTUSD',ETH:'PF_ETHUSD',SOL:'PF_SOLUSD',HYPE:'PF_HYPEUSD'};
          const START=Date.parse('2026-03-13T00:00:00Z'),END=Date.parse('2026-09-14T00:00:00Z'),TRAIN=84*86400000,OOS=42*86400000;
          const avg=a=>a.reduce((s,x)=>s+x,0)/(a.length||1), ema=(a,p)=>{let k=2/(p+1),r=[a[0]];for(let i=1;i<a.length;i++)r.push(a[i]*k+r[i-1]*(1-k));return r};
          const atr=c=>avg(c.slice(-14).map((x,i)=>{let q=c[Math.max(0,c.length-15+i)]||x;return Math.max(x.h-x.l,Math.abs(x.h-q.c),Math.abs(x.l-q.c))}));
          const rsi=a=>{let g=0,l=0;for(let i=Math.max(1,a.length-14);i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100};
          const piv=(c,dir)=>{let z=[];for(let i=3;i<c.length-3;i++){let v=dir>0?c[i].l:c[i].h,q=c.slice(i-3,i+4).map(x=>dir>0?x.l:x.h);if(v===(dir>0?Math.min(...q):Math.max(...q)))z.push({i,p:v})}return z};
          const tl=(c,dir)=>{let p=piv(c,dir).filter(x=>x.i>=c.length-60);if(p.length<2)return 0;let a=p.at(-2),b=p.at(-1),s=(b.p-a.p)/(b.i-a.i);if(dir*s<=0)return 0;let y=a.p+s*(c.length-1-a.i),buf=Math.max(y*.005,atr(c)*.35);for(let i=b.i+1;i<c.length;i++){let line=a.p+s*(i-a.i);if(dir>0&&c[i].c<line-buf||dir<0&&c[i].c>line+buf)return 0}return y};
          const horiz=(c,dir)=>{let p=piv(c,dir).filter(x=>x.i>=c.length-120),g=[];for(let x of p){let z=g.find(z=>Math.abs(z.p-x.p)/z.p<=.0075);z?(z.a.push(x),z.p=avg(z.a.map(q=>q.p))):g.push({p:x.p,a:[x]})}let px=c.at(-1).c;return g.filter(z=>z.a.length>=2).map(z=>({d:Math.abs(px-z.p)/px})).sort((a,b)=>a.d-b.d)[0]?.d??1};
          const fetchC=async s=>{let out=[],from=Math.floor((START-30*86400000)/1000);for(let n=0;n<12;n++){let u=`https://futures.kraken.com/api/charts/v1/trade/${s}/4h?from=${from}&to=${Math.floor(END/1000)}&count=720`,j=await(await fetch(u)).json();if(!j.candles?.length)break;let r=j.candles.map(x=>({t:+x.time,o:+x.open,h:+x.high,l:+x.low,c:+x.close,v:+x.volume}));out.push(...r);let last=r.at(-1).t;if(!j.more_candles||last>=END)break;from=Math.floor(last/1000)+1}return [...new Map(out.map(x=>[x.t,x])).values()].sort((a,b)=>a.t-b.t).filter(x=>x.t>=START-30*86400000)};
          function feat(c,dir){let cl=c.map(x=>x.c),x=c.at(-1),a=atr(c),e5=ema(cl,5).at(-1),e13=ema(cl,13).at(-1),e8=ema(cl,8).at(-1),e21=ema(cl,21).at(-1),e20=ema(cl,20).at(-1),e50=ema(cl,50).at(-1),r=rsi(cl),t=tl(c,dir),h=horiz(c,dir),vr=x.v/avg(c.slice(-21,-1).map(q=>q.v)),body=Math.abs(x.c-x.o)/(x.h-x.l||1),sg=dir>0?1:-1;
            let trend=sg*((e5>e13?1:-1)+(e8>e21?1:-1)+(x.c>e20?1:-1)+(e20>e50?1:-1)),mom=sg*((r>50?1:-1)+(Math.abs(x.c-cl.at(-6))/a>1?1:-1)),structure=(t?1:0)+(h<.015?1:0),vol=(vr>1?1:-1),react=(body>.4&&(dir>0?x.c>x.o:x.c<x.o)?1:0);return 50+trend*5+mom*5+structure*10+vol*5+react*5}
          function simulate(c,start,end,blo,bhi){let open=null,o={n:0,w:0,r:0};for(let i=80;i<c.length;i++){let x=c[i];if(x.t<start)continue;if(x.t>=end)break;if(open){let s=open.d,hit=s>0?x.l<=open.sl:x.h>=open.sl;if(hit){o.n++;o.r-=1;open=null;continue}let rr=((x.c-open.e)*s)/open.r;if(rr>=2){o.n++;o.w++;o.r+=2;open=null;continue}}if(!open){let d5=ema(c.slice(0,i+1).map(x=>x.c),5).at(-1),d13=ema(c.slice(0,i+1).map(x=>x.c),13).at(-1),dir=d5>d13?1:d5<d13?-1:0;if(!dir)continue;let t=tl(c.slice(0,i+1),dir),score=feat(c.slice(0,i+1),dir);if(t&&Math.abs((x.c-t)/t)<.012&&score>=blo&&score<bhi){let a=atr(c.slice(0,i+1)),sl=dir>0?x.c-Math.max(a*1.5,x.c*.008):x.c+Math.max(a*1.5,x.c*.008);open={d:dir,e:x.c,sl,r:Math.abs(x.c-sl)}}}}if(open){let x=c.filter(z=>z.t<end).at(-1),rr=((x.c-open.e)*open.d)/open.r;o.n++;o.r+=rr;if(rr>0)o.w++}return[o.n,o.w,o.n?+(100*o.w/o.n).toFixed(1):0,+o.r.toFixed(2)]}
          let all={};for(let [name,s] of Object.entries(P)){let c=await fetchC(s),agg={};for(let b of [[0,40],[40,55],[55,70],[70,85],[85,101]]){let key=b.join('-'),n=0,w=0,r=0;for(let st=START+TRAIN;st<END;st+=OOS){let e=Math.min(st+OOS,END),q=simulate(c,st,e,...b);n+=q[0];w+=q[1];r+=q[3]}agg[key]={trades:n,winRate:+(100*w/n||0).toFixed(1),netR:+r.toFixed(2),avgR:+(r/n||0).toFixed(3)}}all[name]={candles:c.length,aggregate:agg}}console.log(JSON.stringify({method:'V28 opportunity generator + continuous alpha score buckets; no hard gates; 84d/42d walk-forward',results:all},null,2));
          NODE