name: CXSwitch historical backtest
on:
  push:
    branches: [main]
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FINAL research V28 anchor lifecycle test
        run: |
          sed -i 's/const foldSize=42,trainSize=63/const foldSize=252,trainSize=504/' scripts/research-v28-anchor-final.mjs
          node scripts/research-v28-anchor-final.mjs
