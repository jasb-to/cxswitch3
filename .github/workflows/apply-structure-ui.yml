name: apply-structure-ui
on:
  push:
    branches: [feat/structure-shift-test]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Structure Shift into cards
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/api/cron/route.ts'); s=p.read_text()
          old='const snapshot=result.market||getMarketSnapshot(pair,c1,c4,c15);snapshot.fourH513=ema513;'
          new='const snapshot=result.market||getMarketSnapshot(pair,c1,c4,c15);snapshot.fourH513=ema513;snapshot.structureShift=structureShift;'
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace('interface MarketData { pair:string; price:number; trend:string;', 'interface MarketData { structureShift?:{structure:string;state:string;protectedLevel:number|null;breakDistanceAtr:number|null;breakConfirmed:boolean;reason:string;closedCandleTimestamp?:number}; pair:string; price:number; trend:string;')
          marker='{dailyDiag&&<div'
          insert='{m?.structureShift&&<div className={`mt-3 rounded-xl border p-3 ${m.structureShift.state==="SHIFT_CONFIRMED"?"border-red-500/30 bg-red-500/[0.05]":m.structureShift.state==="WEAKENING"?"border-yellow-500/30 bg-yellow-500/[0.05]":"border-white/[0.08] bg-white/[0.02]"}`}><div className="text-[8px] uppercase tracking-widest text-white/20">Structure Shift · 4H test</div><div className={`mt-1 text-[11px] font-bold ${m.structureShift.state==="SHIFT_CONFIRMED"?"text-red-300":m.structureShift.state==="WEAKENING"?"text-yellow-300":"text-white/70"}`}>{m.structureShift.structure} · {m.structureShift.state}</div><div className="mt-1 text-[9px] text-white/45">Protected {m.structureShift.protectedLevel===null?"—":money(m.structureShift.protectedLevel)} · Break {m.structureShift.breakDistanceAtr===null?"—":`${m.structureShift.breakDistanceAtr.toFixed(2)} ATR`}</div><div className="mt-1 text-[9px] text-white/35">{m.structureShift.reason}</div></div>}'
          if marker in s: s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Structure Shift observation on symbol cards" || exit 0
          git push
          rm -f .github/workflows/apply-structure-ui.yml
          git add -A
          git commit -m "Remove temporary structure UI patch workflow" || exit 0
          git push
