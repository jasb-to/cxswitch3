name: Asset direction regime research
on:
  push:
    branches: [research/early-direction-change]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/research-asset-direction-regime.mjs