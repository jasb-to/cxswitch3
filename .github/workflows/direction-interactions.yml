name: Direction change interaction lab
on:
  push:
    branches: [research/early-direction-change]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run interaction lab
        run: node scripts/research-direction-interactions.mjs
