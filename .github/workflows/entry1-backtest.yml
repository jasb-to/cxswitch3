name: ENTRY_1 Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      months:
        description: "Months of Binance USD-M Futures history"
        required: false
        default: "18"
      pairs:
        description: "Comma-separated symbols"
        required: false
        default: "BTC,ETH,SOL"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKTEST_MONTHS: ${{ github.event.inputs.months || '18' }}
      BACKTEST_PAIRS: ${{ github.event.inputs.pairs || 'BTC,ETH,SOL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Binance USD-M ENTRY_1 backtest
        run: set -o pipefail; pnpm dlx tsx scripts/backtest-entry1.ts | tee entry1-backtest.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: entry1-backtest
          path: entry1-backtest.txt
          retention-days: 30
