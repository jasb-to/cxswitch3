name: Kimi diagnostic rerun
on:
  push:
    branches: [research/kimi-btc-sol-hype-final-20260915]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/research-sol-hype-stage2.mjs > research/sol-hype-stage2-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: sol-hype-stage2-results
          path: research/sol-hype-stage2-results.json
