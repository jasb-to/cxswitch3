name: Strongest BTC SOL HYPE model research v2
on:
  push:
    branches:
      - research/strongest-models-v1-20260915
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run corrected strongest model backtest
        run: node scripts/research-strongest-models-v2.mjs > strongest-models-results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: strongest-models-results-v2
          path: strongest-models-results.json
