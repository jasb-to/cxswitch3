name: Run isolated V28.2 forward-regime backtest
on:
  push:
    branches:
      - research/forward-regime-results-20260915
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run backtest and save results
        run: |
          npx --yes tsx -e "import { GET } from './app/api/backtest-forward-regime/route.ts'; const r = await GET(); const text = await r.text(); console.log(text); require('node:fs').writeFileSync('forward-regime-results.json', text);"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: forward-regime-results
          path: forward-regime-results.json
          retention-days: 30

