name: ETH filter combination research
on:
  pull_request:
    branches: [main]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ETH filter combination holdout
        run: node scripts/research-eth-filter-combinations.mjs
