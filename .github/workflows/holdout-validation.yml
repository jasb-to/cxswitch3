name: Fixed hypothesis holdout validation
on:
  push:
    branches: [research/holdout-validation]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/research-holdout-validation.mjs
