name: Early direction-change research
on:
  push:
    branches: [research/early-direction-change]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run early direction-change test
        run: node scripts/research-early-direction-change.mjs
