name: Quant alpha lab research
on:
  push:
    branches: [research/quant-alpha-lab]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run quant alpha lab
        run: node scripts/research-quant-alpha-lab.mjs